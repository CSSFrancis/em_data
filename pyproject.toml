[project]
name = "em-database"
version = "0.4.0"
description = "A database for electron microscopy data using pooch to download and manage files."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Carter Francis", email = "cartsfrancis@gmail.com" },
]
dependencies = [
    "pooch",
    "pyyaml",
    "tqdm>=4.67.1",
]
keywords = [
    "electron microscopy",
    "database",
    "materials science",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://cssfrancis.github.io/em_data/"
Documentation = "https://cssfrancis.github.io/em_data/datasets.html"
Repository = "https://github.com/CSSFrancis/em_data"
Issues = "https://github.com/CSSFrancis/em_data/issues"

[project.optional-dependencies]
widget = ["anywidget>=0.9"]
tests = ["pytest", "pytest-cov", "hyperspy", "quantem", "anywidget>=0.9"]
doc = ["sphinx", "sphinx-rtd-theme","sphinx-gallery", "quantem", "hyperspy","pydata_sphinx_theme","sphinx_design",]
dev = [
    "ruff",
    "basedpyright",
    "pre-commit",
    "pytest",
    "jsonschema",
    "anywidget>=0.9",
]


[tool.ruff]
line-length = 99
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["em_database"]
exclude = ["**/__pycache__", "doc", "build"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
# `slow` tests pull down the large datasets. They are deselected by default so
# CI checks that every source URL resolves without moving hundreds of megabytes
# on each of the six matrix legs. Run them with `pytest -m slow`.
addopts = "-m 'not slow'"
markers = [
    "slow: downloads a large dataset; deselected by default",
]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
em_database = ["*.pyi", "datasets/*.yaml", "datasets/*.yml", "datasets/*.json", "static/*.js", "static/*.css"]

[tool.setuptools.packages.find]
where = ["."]
include = ["em_database*"]
exclude = ["tests*", "*.tests*"]
